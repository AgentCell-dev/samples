name: check

# The sample apps are the partner tutorial and the onboarding canary's fixtures
# (infra/ONBOARDING-CANARY.md, in the private repository). This job holds no credential: it builds
# every image with docker on the hosted runner and runs `make check`, which starts each container
# once, asserts its marker line, and proves the notes app keeps its notes across a restart.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: make check (builds and runs the seven container samples, and checks the two static ones)
        run: make check
